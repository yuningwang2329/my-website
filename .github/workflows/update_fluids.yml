name: Canonical Literature Mirror

on:
  schedule:
    # MySecondBrain produces at 05:17, 07:47, 08:23, and 09:23 Beijing time.
    # These runs begin about 20 minutes later, allowing its artifact commit to settle.
    - cron: '37 21 * * *'
    - cron: '7 0 * * *'
    - cron: '43 0 * * *'
    - cron: '43 1 * * *'
  workflow_dispatch:

concurrency:
  group: canonical-literature-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror-canonical-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      - name: Checkout MySecondBrain canonical artifacts
        uses: actions/checkout@v5
        with:
          repository: yuningwang2329/MySecondBrain
          ref: main
          path: canonical
          # A fine-grained read-only token is needed only when the source repo is private.
          token: ${{ secrets.LITERATURE_SOURCE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run canonical mirror regression tests
        run: |
          python -m unittest tests.test_canonical_sync -v
          node --test tests/homepage-performance.test.mjs

      - name: Validate and mirror canonical artifacts
        run: python scripts/sync_canonical_literature.py --canonical-root canonical --website-root .

      - name: Check generated artifacts
        run: |
          python -m json.tool literature-manifest.json >/dev/null
          python -m json.tool fluids.json >/dev/null
          python -m json.tool fluids-index.json >/dev/null
          git diff --check

      - name: Commit validated mirror only when it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- fluids.json fluids-index.json literature-manifest.json archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync canonical literature snapshot"
            git push
          fi
