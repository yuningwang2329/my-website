<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
    <title>论文摘要</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo" style="display: flex; align-items: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                返回
            </a>
            <div class="nav-links">
                <a href="https://github.com/yuningwang2329/my-website" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </div>
    </nav>

    <main class="main fade-in">
        <article id="content" class="paper-detail fluids-content" aria-live="polite">
            <p class="status-message">正在加载论文摘要…</p>
        </article>
    </main>

    <footer class="site-footer">
        <div class="footer-disclaimer">
            本页面只镜像公开论文元数据，供个人学习与交流使用；版权归原作者及出版方所有。<br>
            本站不提供未经授权的全文下载服务。
        </div>
    </footer>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var paperId = urlParams.get('id');
        var requestedYear = urlParams.get('year');
        var contentDiv = document.getElementById('content');

        function appendTextElement(parent, tagName, text, className) {
            var element = document.createElement(tagName);
            if (className) element.className = className;
            element.textContent = text;
            parent.appendChild(element);
            return element;
        }

        function displayMessage(title, message) {
            contentDiv.replaceChildren();
            appendTextElement(contentDiv, 'h1', title);
            appendTextElement(contentDiv, 'p', message, 'status-message');
        }

        function displayValue(value) {
            if (Array.isArray(value)) return value.join(', ');
            if (value === null || value === undefined || value === '') return '未提供';
            return String(value);
        }

        function safeOriginalURL(value) {
            if (typeof value !== 'string' || !value) return null;
            try {
                var parsed = new URL(value);
                return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : null;
            } catch (error) {
                return null;
            }
        }

        function appendDetailRow(list, label, value) {
            var term = document.createElement('dt');
            term.textContent = label;
            var description = document.createElement('dd');
            description.textContent = displayValue(value);
            list.append(term, description);
        }

        function renderPaper(paper) {
            contentDiv.replaceChildren();
            appendTextElement(contentDiv, 'h1', displayValue(paper.title));

            var details = document.createElement('dl');
            details.className = 'detail-meta';
            appendDetailRow(details, '作者', paper.authors);
            appendDetailRow(details, '期刊', paper.source);
            appendDetailRow(details, '日期', paper.date);
            appendDetailRow(details, '专题', paper.topic);
            appendDetailRow(details, '标签', paper.tags);
            appendDetailRow(details, '相关度', paper.relevance);
            contentDiv.appendChild(details);

            var originalURL = safeOriginalURL(paper.link);
            if (originalURL) {
                var originalLink = document.createElement('a');
                originalLink.className = 'action-btn original-paper-link';
                originalLink.href = originalURL;
                originalLink.target = '_blank';
                originalLink.rel = 'noopener noreferrer';
                originalLink.textContent = '打开原文';
                contentDiv.appendChild(originalLink);
            }

            var chineseSection = document.createElement('section');
            chineseSection.className = 'detail-section';
            appendTextElement(chineseSection, 'h2', '中文摘要');
            appendTextElement(chineseSection, 'p', displayValue(paper.summary_zh), 'detail-abstract');
            contentDiv.appendChild(chineseSection);

            var englishSection = document.createElement('section');
            englishSection.className = 'detail-section';
            appendTextElement(englishSection, 'h2', 'English abstract');
            appendTextElement(englishSection, 'p', displayValue(paper.abstract_en), 'detail-abstract');
            contentDiv.appendChild(englishSection);

            document.title = `${displayValue(paper.title)} · 流体论文库`;
        }

        function fetchJSON(path) {
            return fetch(path).then(function(response) {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            });
        }

        function descriptorsForManifest(manifest) {
            var descriptors = [];
            if (manifest && manifest.current) descriptors.push(manifest.current);
            var archives = manifest && Array.isArray(manifest.archives) ? manifest.archives : [];
            if (requestedYear) {
                archives.filter(function(archive) {
                    return String(archive.year) === String(requestedYear);
                }).forEach(function(archive) {
                    descriptors.push(archive);
                });
                return descriptors.slice(1);
            }
            return descriptors.concat(archives);
        }

        async function findPaper() {
            if (!paperId) {
                displayMessage('未指定论文', '请返回首页并选择一篇论文。');
                return;
            }
            try {
                var manifestResponse = await fetch('literature-manifest.json');
                if (!manifestResponse.ok) throw new Error(`HTTP ${manifestResponse.status}`);
                var manifest = await manifestResponse.json();
                var descriptors = descriptorsForManifest(manifest);
                for (var index = 0; index < descriptors.length; index += 1) {
                    var descriptor = descriptors[index];
                    if (!descriptor || typeof descriptor.path !== 'string') continue;
                    var papers = await fetchJSON(descriptor.path);
                    if (!Array.isArray(papers)) continue;
                    var paper = papers.find(function(candidate) {
                        return candidate && candidate.id === paperId;
                    });
                    if (paper) {
                        renderPaper(paper);
                        return;
                    }
                }
                displayMessage('未找到论文', '该论文可能已被移动到归档，或订阅快照正在更新。');
            } catch (error) {
                console.error(error);
                displayMessage('加载失败', '论文摘要暂时无法加载。请稍后重试。');
            }
        }

        findPaper();
    </script>
</body>
</html>
