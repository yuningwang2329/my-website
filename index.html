<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="数学流体与偏微分方程论文订阅">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
    <title>流体论文库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">Fluid Papers Tracker</a>
            <div class="nav-links">
                <a href="https://github.com/yuningwang2329/my-website" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; gap: 6px;">
                    <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                    GitHub
                </a>
            </div>
        </div>
    </nav>

    <main class="main stagger fade-in">
        <div class="fluids-layout">
            <button
                id="mobile-filter-toggle"
                class="mobile-filter-toggle"
                type="button"
                aria-controls="mobile-filter-panel"
                aria-expanded="false"
                onclick="toggleMobileFilters(this)">
                筛选文献
            </button>

            <aside id="mobile-filter-panel" class="fluids-sidebar">
                <div class="folder-group">
                    <div class="folder-header">范围</div>
                    <ul class="folder-list" id="scope-folders">
                        <li>
                            <a href="#" class="folder-link active" onclick="switchScope('current', this); return false;">
                                <span>最近 90 天</span>
                                <span class="sidebar-count" id="count-archive">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="folder-link" onclick="switchScope('archive', this); return false;">
                                <span>历史归档</span>
                                <span class="sidebar-count" id="count-history">0</span>
                            </a>
                        </li>
                    </ul>
                    <ul class="folder-list archive-year-filters" id="archive-year-filters" aria-label="历史归档年份"></ul>
                </div>

                <div class="folder-group" style="margin-top: 24px;">
                    <div class="folder-header">文献库</div>
                    <ul class="folder-list" id="main-folders">
                        <li>
                            <a href="#" class="folder-link active" onclick="switchFolder('archive', this); return false;">
                                <span>当前范围全部</span>
                                <span class="sidebar-count" id="count-current-view">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="folder-link" onclick="switchFolder('starred', this); return false;">
                                <span>收藏夹</span>
                                <span class="sidebar-count" id="count-starred">0</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="folder-group" style="margin-top: 24px;">
                    <div class="folder-header">专题 (Topics)</div>
                    <ul class="folder-list" id="topic-folders">
                        <li>
                            <a href="#" class="folder-link" onclick="switchFolder('topic:stability', this); return false;">
                                <span>水动力稳定性</span>
                                <span class="sidebar-count" id="count-stability">0</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="folder-group" style="margin-top: 24px;">
                    <div class="folder-header">期刊组</div>
                    <ul class="folder-list" id="source-group-filters"></ul>
                </div>

                <div class="folder-group" style="margin-top: 24px;">
                    <div class="sidebar-tabs">
                        <button class="sidebar-tab active" onclick="switchFilterTab('journal', this)">按期刊</button>
                        <button class="sidebar-tab" onclick="switchFilterTab('month', this)">按月份</button>
                    </div>
                    <ul class="folder-list" id="journal-filters"></ul>
                    <ul class="folder-list" id="month-filters" style="display: none;"></ul>
                </div>
            </aside>

            <div class="fluids-content">
                <div class="content-header" style="margin-bottom: 12px;">
                    <h1 class="page-title" id="view-title">最近 90 天</h1>
                    <div class="content-actions">
                        <button id="mark-all-read" class="action-btn" style="display: none;" onclick="markAllRead()">标为已读</button>
                    </div>
                </div>
                <p id="subscription-status" class="subscription-status" aria-live="polite">正在读取订阅快照状态…</p>
                <div id="filter-tags-container" class="filter-tags" style="display: none;"></div>
                <div id="fluids-list-container">
                    <p class="status-message">正在加载最近 90 天文献…</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-disclaimer">
            本页面只镜像公开论文元数据，供个人学习与交流使用；版权归原作者及出版方所有。<br>
            本站不提供未经授权的全文下载服务。
        </div>
        <div class="footer-meta"><span id="last-updated"></span></div>
    </footer>

    <script src="literature-browser.js"></script>
</body>
</html>
